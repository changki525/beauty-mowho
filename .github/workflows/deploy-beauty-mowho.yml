name: Deploy beauty-mowho

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 실행 (UTC 0,6,12,18시)
  workflow_dispatch:        # 수동 실행 가능

jobs:
  crawl-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog-to-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Crawl Naver blog
        run: node crawl.js mipoomdal

      - name: Generate website
        run: node generate.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output/ --project-name=beauty-mowho
          workingDirectory: blog-to-site
